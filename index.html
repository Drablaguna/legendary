<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14141A">
  <title>Legendary To-Do</title>
  <script>
    /* Apply saved theme before first paint so a light theme doesn't flash dark */
    try {
      var s = JSON.parse(localStorage.getItem("ltd:v1:settings"));
      if (s && s.theme === "light") document.documentElement.dataset.theme = "light";
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
